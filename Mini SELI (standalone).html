  <script>

    document.addEventListener('DOMContentLoaded', async function () {
      const loading = document.getElementById('__bundler_loading');
      function setStatus(msg) { if (loading) loading.textContent = msg; }

      const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
      const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
      function toBase64(bytes) {
        let bin = '';
        for (let i = 0; i < bytes.length; i += 0x8000) {
          bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
        }
        return btoa(bin);
      }

      // Error sink persists across replaceWith since it's on window, not the DOM.
      window.addEventListener('error', function (e) {
        // Failed resource loads (CSP-blocked links, scripts, images) fire plain
        // events at the element — warn only; real JS errors carry message/error.
        if (!e.message && !e.error && e.target && e.target !== window) {
          console.warn('[bundle] resource failed to load:',
            e.target.tagName, String(e.target.src || e.target.href || ''));
          return;
        }
        var p = document.body || document.documentElement;
        var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
        d.id = '__bundler_err';
        d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
        d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
          '[bundle] ' + (e.message || e.type) +
          (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
      }, true);

      try {
        const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
        const templateEl = document.querySelector('script[type="__bundler/template"]');
        if (!manifestEl || !templateEl) {
          setStatus('Error: missing bundle data');
          console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
          return;
        }

        const manifest = JSON.parse(manifestEl.textContent);
        let template = JSON.parse(templateEl.textContent);

        // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
        // document's manifest; frame srcs carry an about:blank#<uuid> marker
        // instead of a substitutable uuid. Every document mints the blobs for
        // its OWN frames — from local text at the root, or text obtained from
        // its DIRECT parent over the relay protocol below — so each frame
        // navigation stays same-origin with its initiator and a deduped page
        // loads at any depth on any host, including a file:// download's
        // opaque origins (where a blob minted by one document cannot be
        // navigated to by another).
        const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
        const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
        const pageSet = new Set(pageOrder);
        const pageTexts = {};

        // ── Nested-page text protocol (parent-chain relay) ──
        // Page bundles ship once, in the ROOT document's manifest. Every
        // document mints the blobs for its OWN frames, obtaining page text
        // through a strict parent-chain relay: a document only ever SENDS to
        // its direct parent (which, for every document the publisher's own
        // runtime minted, is another publisher document) and only ACCEPTS
        // text from that direct parent; requests from below are honored only
        // for the document's own child frames, and the ROOT never sends
        // upward at all. That last rule is load-bearing: the artifact host's
        // frame-ancestors allows claude.ai (and friends) to frame an
        // artifact, so window.top can be a FOREIGN document — a top-addressed
        // protocol would hand page uuids to that ancestor and accept forged
        // "page text" from it, minting attacker HTML as an artifact-origin
        // blob document. The chain never touches the ancestor: requests stop
        // at the root, replies are origin-addressed per hop (never '*' when
        // an origin exists), and both directions are origin-gated (on https
        // a foreign sender's origin can never equal this document's; in
        // opaque contexts — file:// — everything serializes as 'null', where
        // an embedded EXTERNAL frame still fails the gate by carrying its
        // own real origin, and a sandboxed child of such a frame is excluded
        // by the own-child-frames check plus uuid unguessability). Shape is
        // deny-by-default: one request form, one reply form, no error
        // replies.
        // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
        // contexts such as a sandboxed preview iframe) — location.origin is
        // computed from the URL and stays 'https://…' even when the document
        // is sandboxed, which would misgate every opaque chain.
        const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
          ? window.origin
          : '*';
        function trustedOrigin(e) {
          if (e.origin === window.origin) return true; // https chains; opaque==opaque
          // file:// trees: Chrome serializes the file document's origin as
          // 'file://' while the blob: documents it mints serialize as 'null',
          // so the two legitimate shapes can never string-match — accept the
          // pair in both directions. https origins never serialize as either,
          // and sender identity (own child frame / direct parent) is checked
          // separately.
          return (
            (e.origin === 'null' &&
              (window.origin === 'file://' ||
                window.location.protocol === 'file:')) ||
            (/^file:/.test(e.origin) && window.origin === 'null')
          );
        }
        // Non-empty only in the root document (nested bundles ship an empty
        // island), so it doubles as the root marker: the root answers from
        // local text and treats a miss as authoritative — never relaying to
        // its (possibly foreign) parent.
        const isPageRoot = pageOrder.length > 0;
        const blobUrls = {};
        const resourceBlobs = {};
        const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
        const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
        const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
        function mountPage(el, frag, text) {
          const pageBlob = new Blob([text], { type: 'text/html' });
          const u = URL.createObjectURL(pageBlob);
          resourceBlobs[u] = pageBlob;
          el.src = u + frag;
        }
        function deliverPage(uuid, text) {
          const frames = pendingFrames[uuid];
          delete pendingFrames[uuid];
          if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
          const relays = pendingRelays[uuid];
          delete pendingRelays[uuid];
          if (relays) {
            for (const cw of relays) {
              try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
            }
          }
        }
        function ownFrameWindows() {
          const out = [];
          for (const f of Array.from(document.querySelectorAll('iframe'))) {
            try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
          }
          return out;
        }
        window.addEventListener('message', function (e) {
          const d = e.data;
          if (!d || typeof d !== 'object' || !e.source) return;
          // Origin gate first; the structural checks below (own-child-frames
          // for requests, direct-parent + solicited-uuid for replies, the
          // root's never-relay rule) are what hold in fully opaque chains
          // where origin strings can't discriminate — a sandboxed root's
          // FOREIGN wrapper still fails all three even though both serialize
          // as real-vs-'null' rather than matching.
          if (!trustedOrigin(e)) return;
          if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
            // Requests are honored only for this document's own child frames.
            if (ownFrameWindows().indexOf(e.source) < 0) return;
            const uuid = d.__bundler_need;
            const text = pageTexts[uuid];
            if (typeof text === 'string') {
              try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
              return;
            }
            if (isPageRoot || window.parent === window) return; // authoritative miss
            const waiting = pendingRelays[uuid];
            if (waiting) {
              if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
              return;
            }
            // Never-answered uuids would otherwise accumulate forever under a
            // request spray; past the cap (far above any real page count) new
            // relays are dropped rather than remembered.
            if (Object.keys(pendingRelays).length >= 128) return;
            pendingRelays[uuid] = [e.source];
            window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
          } else if (
            typeof d.__bundler_page === 'string' &&
            UUID_SHAPE.test(d.__bundler_page) &&
            typeof d.__bundler_text === 'string'
          ) {
            // The shape test is load-bearing beyond tidiness: the solicited
            // check below uses the in operator, which matches prototype keys
            // ('__proto__', 'constructor') — an unshaped key would reach
            // deliverPage and throw, painting the error banner.
            // Text is accepted only from the direct parent — the document
            // that minted this one.
            if (e.source !== window.parent || window.parent === window) return;
            if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
            deliverPage(d.__bundler_page, d.__bundler_text);
          }
        });

        const uuids = Object.keys(manifest);
        setStatus('Unpacking ' + uuids.length + ' assets...');

        await Promise.all(uuids.map(async (uuid) => {
          const entry = manifest[uuid];
          try {
            const binaryStr = atob(entry.data);
            const bytes = new Uint8Array(binaryStr.length);
            for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

            let finalBytes = bytes;
            if (entry.compressed) {
              if (typeof DecompressionStream !== 'undefined') {
                const ds = new DecompressionStream('gzip');
                const writer = ds.writable.getWriter();
                const reader = ds.readable.getReader();
                writer.write(bytes);
                writer.close();
                const chunks = [];
                let totalLen = 0;
                while (true) {
                  const { done, value } = await reader.read();
                  if (done) break;
                  chunks.push(value);
                  totalLen += value.length;
                }
                finalBytes = new Uint8Array(totalLen);
                let offset = 0;
                for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
              } else {
                console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
              }
            }

            if (pageSet.has(uuid)) {
              pageTexts[uuid] = new TextDecoder().decode(finalBytes);
              return;
            }
            if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
              // Strict artifact hosts allow font-src data: but not blob:.
              blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
                (entry.compressed ? toBase64(finalBytes) : entry.data);
            } else {
              const blob = new Blob([finalBytes], { type: entry.mime });
              blobUrls[uuid] = URL.createObjectURL(blob);
              resourceBlobs[blobUrls[uuid]] = blob;
            }
          } catch (err) {
            console.error('Failed to decode asset ' + uuid + ':', err);
            const blob = new Blob([], { type: entry.mime });
            blobUrls[uuid] = URL.createObjectURL(blob);
            resourceBlobs[blobUrls[uuid]] = blob;
          }
        }));

        const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
        const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
        const resourceMap = {};
        for (const entry of extResources) {
          if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
        }

        // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
        // consumers read these Blobs directly. Survives the swap like the error sink.
        window.__resourceBlobs = resourceBlobs;

        setStatus('Rendering...');
        // Page uuids have no blob here — they ride inside about:blank#<uuid>
        // frame markers the pass below resolves after the swap.
        for (const uuid of uuids) {
          if (pageSet.has(uuid)) continue;
          template = template.split(uuid).join(blobUrls[uuid]);
        }

        // Strip integrity + crossorigin — blob URLs from a file:// document inherit
        // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
        // The manifest bytes are ours; SRI protects against CDN compromise, not this.
        template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

        const resourceScript = '<script>window.__resources = ' +
          JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
          ';</' + 'script>';
        // Inject after <head> so the DOCTYPE stays first; prepending the script
        // would push the parser into quirks mode. DOMParser always emits a <head>
        // (synthesizing one if the source HTML omitted it) but may carry
        // attributes through, so match the full opening tag. slice() rather than
        // replace() keeps us clear of $-pattern substitution in resourceScript.
        const headOpen = template.match(/<head[^>]*>/i);
        if (headOpen) {
          const i = headOpen.index + headOpen[0].length;
          template = template.slice(0, i) + resourceScript + template.slice(i);
        }

        // Parse the template and swap the root element. Scripts inserted via
        // DOMParser/replaceWith are inert per spec — re-create each with
        // createElement so they execute, awaiting onload for src scripts to
        // preserve ordering (React before ReactDOM before Babel before text/babel).
        const doc = new DOMParser().parseFromString(template, 'text/html');
        document.documentElement.replaceWith(doc.documentElement);

        // Resolve page-frame markers: mint this document's own blob for each
        // framed page — from local text when this is the root, otherwise by
        // asking the direct parent over the relay protocol above. An
        // unanswered request leaves the frame on about:blank, the same
        // degraded state as a refused embed.
        {
          const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
          const needed = [];
          for (const el of Array.from(document.querySelectorAll('iframe'))) {
            const m = MARKER.exec(el.getAttribute('src') || '');
            if (!m) continue;
            const text = pageTexts[m[1]];
            if (typeof text === 'string') {
              mountPage(el, m[2] || '', text);
            } else if (window.parent !== window && !isPageRoot) {
              const had = pendingFrames[m[1]];
              (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
              if (!had) needed.push(m[1]);
            }
          }
          for (const uuid of needed) {
            window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
          }
        }

        const dead = Array.from(document.scripts);
        for (const old of dead) {
          const s = document.createElement('script');
          for (const a of old.attributes) s.setAttribute(a.name, a.value);
          s.textContent = old.textContent;
          // text/babel scripts with a src: read and inline. transformScriptTags
          // does XHR against the src, but blob:null/ from a file:// origin is
          // silently dropped. Inlining makes it a plain inline babel script,
          // which transformScriptTags handles unconditionally.
          if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
            const pre = resourceBlobs[s.src.split('#')[0]];
            s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
            s.removeAttribute('src');
          }
          const p = s.src ? new Promise(function (r) { s.onload = s.onerror = r; }) : null;
          old.replaceWith(s);
          if (p) await p;
        }
        // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
        // which fired before we swapped the document. Trigger manually if present.
        if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
          window.Babel.transformScriptTags();
        }
      } catch (err) {
        setStatus('Error unpacking: ' + err.message);
        console.error('Bundle unpack error:', err);
      }
    });

  </script>

} }\n    @keyframes seliFadeUp { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:none; } }\n    @keyframes seliCue { 0%,100% { opacity:0.25; transform:translateY(0); } 50% { opacity:0.9; transform:translateY(6px); } }\n    @keyframes seliAppear { to { opacity:1; } }\n    @keyframes seliRipple { 0% { transform:scale(0.3); opacity:0.9; } 70% { opacity:0.15; } 100% { transform:scale(2.6); opacity:0; } }\n    @keyframes seliPop { 0% { opacity:0; transform:scale(0.82) translateY(6px); } 60% { transform:scale(1.05) translateY(0); } 100% { opacity:1; transform:none; } }\n    @keyframes seliShake { 0%,100% { transform:translateX(0); } 20% { transform:translateX(-6px); } 40% { transform:translateX(5px); } 60% { transform:translateX(-3px); } 80% { transform:translateX(2px); } }\n    @keyframes seliBreathe { 0%,100% { opacity:0.5; } 50% { opacity:1; } }\n    @media (prefers-reduced-motion: reduce) {\n      * { animation:none !important; transition:none !important; }\n      #hero svg path, #hero svg line { stroke-dashoffset:0 !important; }\n      #hero svg circle, #hero svg line { opacity:1 !important; }\n    }\n    input[type=\"range\"] { accent-color:#F0603D; }\n    input::placeholder { color:rgba(167,192,255,0.4); }\n  <\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"background:#081026; min-height:100vh; display:flex; flex-direction:column;\">\n\n  <!-- ============ S4 · MINI SELI · Experience ============ -->\n  <div id=\"snapshot\" data-screen-label=\"S6 · Mini SELI\" style=\"background:transparent; padding:0; color:#E8ECF6;\">\n    <div style=\"max-width:1080px; margin:0 auto;\">\n      <div data-reveal=\"\" style=\"display:flex; justify-content:center;\">\n        <div style=\"width:100%; max-width:860px; border-radius:22px; background:#0B1E45; border:1px solid rgba(167,192,255,0.16); box-shadow:0 30px 70px rgba(4,10,26,0.55); overflow:hidden;\">\n          <div style=\"display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px 22px; border-bottom:1px solid rgba(167,192,255,0.12);\">\n            <div style=\"font-size:11px; letter-spacing:0.16em; font-weight:700; color:#A7C0FF;\">MINI SELI<\u002Fdiv>\n            <div style=\"font-size:11px; letter-spacing:0.14em; font-weight:700; color:#F0603D; text-align:right;\">{{ miniTopRight }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"position:relative; min-height:430px; padding:clamp(22px,4vw,36px) clamp(18px,4.5vw,40px) clamp(26px,4vw,36px);\">\n            <sc-if value=\"{{ isIntro }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"animation:seliFadeUp 0.5s cubic-bezier(0.22,1,0.36,1); max-width:660px; margin:0 auto;\">\n                <div style=\"font-size:11px; font-weight:700; letter-spacing:0.14em; color:#F0603D;\">TRƯỚC KHI BẮT ĐẦU<\u002Fdiv>\n                <div class=\"genos\" style=\"margin-top:12px; font-family:Genos,Archivo,sans-serif; font-weight:600; font-size:clamp(30px,4.4vw,38px); line-height:1.12; color:#fff;\">Trải nghiệm Mini-SELI<\u002Fdiv>\n                <div style=\"margin-top:12px; display:flex; flex-direction:column; gap:10px; font-size:14.5px; line-height:1.7; color:#C7D4F5; text-wrap:pretty;\">\n                  <p style=\"margin:0;\">Mini SELI là một bản demo của hệ thống đánh giá gốc, sử dụng những câu hỏi sẽ được hỏi và những lát cắt về nội dung trong phiên bản đầy đủ của SELI.<\u002Fp>\n                  <p style=\"margin:0;\">Với các năng lực lãnh đạo, điều quan trọng nhất là khi đứng giữa những quyết định, tình huống quyết định của bạn là gì, phản xạ bản năng nào sẽ đưa bạn đến những quyết định đó. Và quan trọng nhất, sau tất cả phong cách lãnh đạo của bạn ảnh hưởng như thế nào tới đội ngũ.<\u002Fp>\n                  <p style=\"margin:0; color:#fff;\">Cùng khám phá trong hành trình này nhé!<\u002Fp>\n                <\u002Fdiv>\n                <div style=\"margin-top:22px; display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:12px;\">\n for list=\"{{ sigList }}\" as=\"sg\" hint-placeholder-count=\"3\">\n                        <div style=\"display:grid; grid-template-columns:minmax(88px,110px) minmax(0,1fr); gap:14px; align-items:baseline;\"><span style=\"font-size:10.5px; font-weight:700; letter-spacing:0.12em; color:#F0603D;\">{{ sg.label }}<\u002Fspan><span style=\"font-size:15.5px; line-height:1.6; color:#E8ECF6;\">{{ sg.text }}<\u002Fspan><\u002Fdiv>\n                      <\u002Fsc-for>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"margin-top:clamp(36px,5vw,52px); padding-top:clamp(28px,4vw,40px); border-top:1px solid rgba(167,192,255,0.15); display:flex; flex-direction:column; gap:clamp(28px,4vw,40px); animation:seliFadeUp .7s cubic-bezier(.22,1,.36,1) 0.35s both;\">\n                    <div><div style=\"font-size:11px; font-weight:700; letter-spacing:0.14em; color:#A7C0FF;\">ĐIỀU NÀY ĐANG GIÚP TÔI<\u002Fdiv><div style=\"margin-top:10px; display:flex; flex-direction:column; gap:8px; max-width:640px;\"><sc-for list=\"{{ rStrength }}\" as=\"p\" hint-placeholder-count=\"2\"><p style=\"margin:0; font-size:18px; font-weight:600; line-height:1.5; color:#fff; text-wrap:pretty;\">{{ p.t }}<\u002Fp><\u002Fsc-for><\u002Fdiv><\u002Fdiv>\n                    <div><div style=\"font-size:11px; font-weight:700; letter-spacing:0.14em; color:#A7C0FF;\">MỘT ĐIỀU ĐÁNG ĐỂ Ý<\u002Fdiv><div style=\"margin-top:10px; display:flex; flex-direction:column; gap:8px; max-width:640px;\"><sc-for list=\"{{ rTension }}\" as=\"p\" hint-placeholder-count=\"2\"><p style=\"margin:0; font-size:16px; line-height:1.65; color:#E8ECF6; text-wrap:pretty;\">{{ p.t }}<\u002Fp><\u002Fsc-for><\u002Fdiv><\u002Fdiv>\n                    <sc-if value=\"{{ hasTeam }}\" hint-placeholder-val=\"{{ true }}\"><div><div style=\"font-size:11px; font-weight:700; letter-spacing:0.14em; color:#A7C0FF;\">NHÌN TỪ PHÍA ĐỘI NGŨ<\u002Fdiv><div style=\"margin-top:10px; display:flex; flex-direction:column; gap:8px; max-width:640px;\"><sc-for list=\"{{ rTeam }}\" as=\"p\" hint-placeholder-count=\"2\"><p style=\"margin:0; font-size:16px; line-height:1.65; color:#E8ECF6; text-wrap:pretty;\">{{ p.t }}<\u002Fp><\u002Fsc-for><\u002Fdiv><\u002Fdiv><\u002Fsc-if>\n                  <\u002Fdiv>\n                  <div style=\"margin-top:clamp(40px,6vw,64px); animation:seliFadeUp .7s cubic-bezier(.22,1,.36,1) 0.45s both;\">\n                    <div style=\"font-size:11px; font-weight:700; letter-spacing:0.14em; color:#A7C0FF; color:#F0603D;\">CÂU HỎI QUAN TRỌNG<\u002Fdiv>\n                    <div class=\"genos\" style=\"margin-top:16px; font-family:Genos,Archivo,sans-serif; font-weight:600; font-size:clamp(28px,4.6vw,44px); line-height:1.1; color:#F0603D; text-wrap:balance; max-width:760px;\">{{ rReflection }}<\u002Fdiv>\n                  <\u002Fdiv>\n                  <sc-if value=\"{{ hasShift }}\" hint-placeholder-val=\"{{ true }}\">\n                    <div style=\"margin-top:clamp(32px,5vw,44px); max-width:640px; background:rgba(255,255,255,0.05); border:1px solid rgba(167,192,255,0.2); border-radius:18px; padding:clamp(22px,3.5vw,30px); animation:seliFadeUp .7s cubic-bezier(.22,1,.36,1) 0.55s both;\">\n                      <div style=\"font-size:11px; font-weight:700; letter-spacing:0.14em; color:#A7C0FF;\">THỰC HÀNH<\u002Fdiv>\n                      <div style=\"margin-top:6px; font-size:14px; color:#8A94A3;\">Không cần thay đổi cách bạn lãnh đạo. Chỉ cần có thêm một lựa chọn.<\u002Fdiv>\n                      <div style=\"margin-top:16px; display:flex; flex-direction:column; gap:8px;\"><sc-for list=\"{{ rShift }}\" as=\"p\" hint-placeholder-count=\"2\"><p style=\"margin:0; font-size:17px; line-height:1.6; color:#fff; font-weight:500; text-wrap:pretty;\">{{ p.t }}<\u002Fp><\u002Fsc-for><\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-if>\n                  <div style=\"margin-top:clamp(44px,6vw,64px); padding-top:clamp(28px,4vw,40px); border-top:1px solid rgba(167,192,255,0.15); animation:seliFadeUp .7s cubic-bezier(.22,1,.36,1) 0.65s both;\">\n                    <div style=\"font-size:11px; font-weight:700; letter-spacing:0.14em; color:#A7C0FF; color:#F0603D;\">ĐÂY CHỈ LÀ MỘT LÁT CẮT<\u002Fdiv>\n                    <div class=\"genos\" style=\"margin-top:14px; font-family:Genos,Archivo,sans-serif; font-weight:600; font-size:clamp(28px,4.2vw,38px); line-height:1.1; text-wrap:pretty; max-width:640px;\">15 câu hỏi không thể kể hết câu chuyện leadership của bạn.<\u002Fdiv>\n                    <div style=\"margin-top:16px; max-width:600px; display:flex; flex-direction:column; gap:8px; font-size:15px; line-height:1.7; color:#C7D4F5;\">\n                      <p style=\"margin:0;\">Mini SELI vừa cho bạn thấy một pattern nổi bật trong cách bạn lựa chọn và phản ứng.<\u002Fp>\n                      <p style=\"margin:0;\">Full SELI đi sâu hơn vào những năng lực phía sau cách bạn lãnh đạo, những tension giữa chúng và những điểm đáng để bạn chú ý.<\u002Fp>\n                    <\u002Fdiv>\n                    <div style=\"margin-top:26px;\"><a href=\"SELI Homepage.dc.html#cta-cuoi\" style=\"display:inline-block; padding:15px 30px; border-radius:99px; background:#F0603D; color:#fff; font-size:13px; font-weight:700; letter-spacing:0.08em; box-shadow:0 10px 34px rgba(240,96,61,0.35);\" style-hover=\"background:#C74B2D; color:#fff;\">KHÁM PHÁ FULL SELI →<\u002Fa><\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"margin-top:clamp(32px,5vw,44px); padding-top:14px; border-top:1px solid rgba(167,192,255,0.15); display:flex; justify-content:space-between; gap:10px; font-size:11px; letter-spacing:0.06em; color:#8A94A3;\"><span>SELI · Strategic EQ Leadership Index<\u002Fspan><span>{{ shareUrlShort }}<\u002Fspan><\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"margin-top:14px; display:flex; gap:10px; flex-wrap:wrap;\">\n                  <button sc-camel-on-click=\"{{ downloadCard }}\" style=\"font-family:inherit; cursor:pointer; border:none; border-radius:99px; padding:12px 24px; background:#F0603D; color:#fff; font-size:13.5px; font-weight:600; box-shadow:0 10px 34px rgba(240,96,61,0.35); transition:background .15s, transform .1s;\" style-hover=\"background:#C74B2D;\" style-active=\"transform:scale(0.96);\">Tải thẻ kết quả<\u002Fbutton>\n                  <button sc-camel-on-click=\"{{ shareFb }}\" style=\"font-family:inherit; cursor:pointer; border-radius:99px; padding:12px 22px; background:rgba(167,192,255,0.08); border:1px solid rgba(167,192,255,0.3); color:#C7D4F5; font-size:13.5px; font-weight:600;\" style-hover=\"border-color:#A7C0FF; color:#fff;\">Facebook<\u002Fbutton>\n                  <button sc-camel-on-click=\"{{ shareLi }}\" style=\"font-family:inherit; cursor:pointer; border-radius:99px; padding:12px 22px; background:rgba(167,192,255,0.08); border:1px solid rgba(167,192,255,0.3); color:#C7D4F5; font-size:13.5px; font-weight:600;\" style-hover=\"border-color:#A7C0FF; color:#fff;\">LinkedIn<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n\n  <\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;demoState&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;off&quot;,&quot;options&quot;:[&quot;off&quot;,&quot;A&quot;,&quot;B&quot;,&quot;C&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Mini SELI&quot;},&quot;autoAdvance&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Mini SELI&quot;},&quot;shareUrl&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;https://thenewleaders.asia/seli-landing/&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Mini SELI&quot;}}\">\nclass Component extends DCLogic {\n  state = { scrolled: false, phase: 'intro', qi: 0, answers: {}, lead: { name: '', email: '', company: '', role: '' }, formError: '', result: null, snapReady: false };\n\n  componentDidMount() {\n    this.reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;\n    this.onScroll = () => { const s = window.scrollY > 60; if (s !== this.state.scrolled) this.setState({ scrolled: s }); };\n    window.addEventListener('scroll', this.onScroll, { passive: true });\n    this.hidden = new Set();\n    this.checkReveals = () => {\n      const vh = window.innerHeight;\n      this.hidden.forEach(el => {\n        if (!el.isConnected) { this.hidden.delete(el); return; }\n        const r = el.getBoundingClientRect();\n        if (r.top < vh * 0.9 && r.bottom > 0) { el.style.opacity = '1'; el.style.transform = 'none'; this.hidden.delete(el); }\n      });\n    };\n    this.onRevealScroll = () => this.checkReveals();\n    window.addEventListener('scroll', this.onRevealScroll, { passive: true });\n    window.addEventListener('resize', this.onRevealScroll, { passive: true });\n    this.revealTimer = setInterval(this.checkReveals, 400);\n    this.initReveals();\n    try {\n      const s = JSON.parse(localStorage.getItem('seliMini15State') || 'null');\n      if (s && s.lead) this.setState({ lead: { ...this.state.lead, ...s.lead } });\n      if (s && s.result && s.result.prim && s.result.leans && this.MINI().P[s.result.profile]) this.setState({ result: s.result, phase: 'result' });\n      this.armSnap();\n    } catch (e) {}\n  }\n  componentDidUpdate() { this.initReveals(); }\n  componentWillUnmount() {\n    window.removeEventListener('scroll', this.onScroll);\n    window.removeEventListener('scroll', this.onRevealScroll);\n    window.removeEventListener('resize', this.onRevealScroll);\n    clearInterval(this.revealTimer);\n    clearTimeout(this.__adv); clearTimeout(this.__proc); clearTimeout(this.__snap);\n  }\n  initReveals() {\n    document.querySelectorAll('[data-reveal]').forEach(el => {\n      if (el.__rv) return; el.__rv = 1;\n      if (this.reduced) return;\n      const r = el.getBoundingClientRect();\n      if (r.top < window.innerHeight * 0.9) return;\n      el.style.opacity = '0'; el.style.transform = 'translateY(24px)';\n      el.style.transition = 'opacity .7s cubic-bezier(0.22,1,0.36,1), transform .7s cubic-bezier(0.22,1,0.36,1)';\n      this.hidden.add(el);\n    });\n  }\n  MINI() {\n    if (this.__mini) return this.__mini;\n    const L5 = ['Hoàn toàn không đồng ý', 'Không đồng ý', 'Trung lập', 'Đồng ý', 'Hoàn toàn đồng ý'];\n    const QS = [\n      { n: 1, t: 'L', q: 'Khi bắt đầu một dự án có mục tiêu khá tham vọng, lúc thấy mọi người còn đang hơi mơ hồ, tôi thường dành phần lớn thời gian đầu để chia sẻ về tầm nhìn và bức tranh lớn, phần phân công cụ thể phải dời sang buổi sau.' },\n      { n: 2, t: 'L', q: 'Khi một thành viên báo cáo với giọng điệu ngập ngừng về một hạng mục bị trễ, tôi thường hỏi thêm về những khó khăn cụ thể đang gặp, việc này làm lịch trình buổi họp bị dồn lại một chút.' },\n      { n: 3, t: 'L', q: 'Khi nhận được một góp ý khá thẳng về cách quản lý của mình, tôi tin rằng việc dành thời gian suy ngẫm về những điểm đó là cần thiết, dù phải sắp xếp lại các ưu tiên công việc khác trong ngày.' },\n      { n: 4, t: 'L', q: 'Khi một thành viên trình bày ý tưởng mới và giọng điệu có phần ngập ngừng, tôi thường dành thêm thời gian hỏi về những điểm bạn đó còn băn khoăn, lịch trình họp của cả nhóm thường phải điều chỉnh lại một chút.' },\n      { n: 5, t: 'L', q: 'Lúc một thành viên trình bày giải pháp còn lúng túng, tôi có xu hướng đặt vài câu hỏi về cách họ tiếp cận vấn đề, buổi trao đổi thường kết thúc muộn hơn dự kiến.' },\n      { n: 6, t: 'F', q: 'Khi bắt đầu một dự án quan trọng với mục tiêu đầy tham vọng nhưng con đường chưa rõ ràng, tôi có xu hướng:', o: ['Tập hợp đội nhóm, trình bày một tầm nhìn tổng thể đầy cảm hứng về kết quả cuối cùng để mọi người cùng hướng tới.', 'Tổ chức một buổi họp để thu thập tất cả ý kiến, phân tích các khả năng và để nhóm cùng quyết định hướng đi đầu tiên.'] },\n      { n: 7, t: 'F', q: 'Khi một dự án quan trọng do bạn quản lý bất ngờ thất bại ngay trước hạn chót, phản ứng đầu tiên của bạn thường là gì?', o: ['Dành một chút thời gian để ổn định cảm xúc và suy nghĩ của bản thân trước khi thông báo cho các bên liên quan.', 'Ngay lập tức triệu tập đội ngũ để xác định nguyên nhân và bắt đầu xây dựng kế hoạch khắc phục sự cố.'] },\n      { n: 8, t: 'F', q: 'Khi một dự án quan trọng có nguy cơ trễ hẹn do vấn đề phát sinh, bạn sẽ ưu tiên hành động nào trước?', o: ['Thông báo ngay cho các bên liên quan về rủi ro, ngay cả khi chưa có giải pháp cuối cùng, để mọi người cùng nắm bắt tình hình.', 'Tập trung cùng team phân tích và tìm ra phương án giải quyết khả thi trước, sau đó mới cập nhật tình hình kèm theo kế hoạch mới.'] },\n      { n: 9, t: 'F', q: 'Khi một dự án quan trọng do bạn phụ trách không đạt được kết quả như kỳ vọng, bạn sẽ tập trung vào điều gì khi báo cáo với cấp trên?', o: ['Phân tích sâu về những bài học kinh nghiệm, các giả định sai lầm và tiềm năng cải tiến cho các dự án trong tương lai.', 'Trình bày rõ ràng các nguyên nhân khách quan và chủ quan dẫn đến sai lệch, kèm theo kế hoạch hành động khắc phục ngay lập tức.'] },\n      { n: 10, t: 'F', q: 'Trong một buổi họp quan trọng, một thành viên có chuyên môn cao tỏ ra im lặng và không đóng góp, khác hẳn với thường lệ. Với vai trò là người dẫn dắt, tôi sẽ:', o: ['Tìm cách tương tác riêng với họ sau buổi họp, hỏi han về quan sát của mình và lắng nghe xem liệu có vấn đề gì đang ảnh hưởng đến họ không.', 'Chủ động điều phối cuộc họp, đặt một câu hỏi trực tiếp cho họ về lĩnh vực chuyên môn của họ để khuyến khích họ tham gia vào dòng thảo luận chung.'] },\n      { n: 11, t: 'F', q: 'Khi một thành viên trong nhóm có vẻ mất tập trung và sa sút hiệu suất, tôi có xu hướng...', o: ['Chủ động thảo luận về các rào cản trong công việc và đề xuất các giải pháp hỗ trợ để họ quay lại guồng quay.', 'Tạo một không gian riêng tư để hỏi thăm về tình hình chung của họ, và lắng nghe xem có điều gì đang làm họ bận tâm không.'] },\n      { n: 12, t: 'F', q: 'Một thành viên nhóm, dù có năng lực, tỏ ra thiếu tự tin khi được giao một dự án quan trọng lần đầu. Để hỗ trợ bạn ấy, tôi sẽ...', o: ['Hỏi về những lo ngại cụ thể của bạn ấy và điều gì khiến bạn ấy nghĩ mình chưa sẵn sàng, để bạn ấy tự nhận diện và đối mặt với rào cản.', 'Chia sẻ những lần tôi từng đối mặt với thử thách tương tự và cách tôi vượt qua, nhằm truyền cảm hứng và củng cố niềm tin cho bạn ấy.'] },\n      { n: 13, t: 'F', q: 'Khi khởi động một dự án chiến lược có nhiều sự hoài nghi từ đội ngũ, tôi có xu hướng...', o: ['Bắt đầu bằng cách chia sẻ một câu chuyện cá nhân về lý do tại sao dự án này lại có ý nghĩa sâu sắc với tôi, kết nối nó với các giá trị chung mà chúng ta cùng theo đuổi.', 'Tập trung trình bày một kế hoạch thực thi chi tiết, các mốc thời gian rõ ràng và phân bổ nguồn lực hợp lý để chứng minh tính khả thi của dự án.'] },\n      { n: 14, t: 'S', q: 'Hai thành viên có kinh nghiệm trong nhóm, An và Bình, có quan điểm trái ngược về phương pháp tiếp cận một nhiệm vụ quan trọng. An ủng hộ một phương pháp đã được kiểm chứng, an toàn hơn. Bình đề xuất một phương pháp mới, có khả năng nhanh hơn nhưng chưa được thử nghiệm. Cuộc tranh luận của họ đang làm chậm tiến độ chung. Bạn sẽ xử lý tình huống này như thế nào?', o: ['Tổ chức một buổi làm việc với An và Bình. Thiết lập các tiêu chí đánh giá chung (rủi ro, thời gian, chất lượng) và yêu cầu họ cùng nhau đánh giá cả hai phương án theo các tiêu chí này để đề xuất giải pháp.', 'Với vai trò quản lý, bạn tự đưa ra quyết định chọn phương pháp của An vì tính an toàn và thông báo cho cả hai để nhóm tiếp tục công việc.', 'Yêu cầu An và Bình mỗi người điều chỉnh một phần phương pháp của mình để tạo ra một giải pháp lai, kết hợp một số yếu tố của cả hai cách tiếp cận.', 'Tổ chức một cuộc họp với An và Bình. Yêu cầu mỗi người trình bày ưu, nhược điểm của phương pháp mình đề xuất, sau đó bạn sẽ đưa ra quyết định dựa trên các phân tích đó.'] },\n      { n: 15, t: 'S', q: 'Một thành viên trong nhóm, An, thường hoàn thành tốt công việc. Tuy nhiên, gần đây bạn nhận thấy An hay gửi kết quả sát thời hạn và chất lượng có phần giảm sút. Trong buổi họp, An cũng ít phát biểu hơn. Bạn sẽ làm gì?', o: ['Gặp riêng An, đưa ra các ví dụ cụ thể về việc chất lượng công việc giảm và hỏi thẳng về nguyên nhân. Cùng An xây dựng một kế hoạch hành động để cải thiện.', 'Trong cuộc họp nhóm tiếp theo, bạn phân công An phụ trách một phần quan trọng của dự án và nói rằng bạn tin tưởng vào khả năng của An để tạo thêm động lực.', 'Gửi email cho An, tóm tắt lại các quan sát của bạn về hiệu suất gần đây và đề nghị một cuộc gặp để thảo luận về các biện pháp hỗ trợ bạn có thể cung cấp.', 'Mời An một buổi cà phê và trò chuyện cởi mở. Bạn hỏi thăm về công việc nói chung và hỏi: \"Dạo này mọi việc của bạn thế nào? Có điều gì bạn muốn chia sẻ không?\"'] }\n    ];\n    // Four leadership balances. Left pole = negative, right pole = positive.\n    const SIG = {\n      A: { poles: ['QUAN TÂM CON NGƯỜI', 'ĐÒI HỎI KẾT QUẢ'], low: 'quan tâm con người', high: 'đòi hỏi kết quả', neg: 'P03', pos: 'P04' },\n      B: { poles: ['PHẢN TƯ', 'XỬ LÝ NGAY LẬP TỨC'], low: 'phản tư', high: 'xử lý ngay lập tức', neg: 'P02', pos: 'P01' },\n      C: { poles: ['ĐỌC TÍN HIỆU CẢM XÚC', 'GIỮ SỰ BÌNH TĨNH'], low: 'đọc tín hiệu cảm xúc', high: 'giữ sự bình tĩnh', neg: 'P06', pos: 'P05' },\n      D: { poles: ['THẤU CẢM CON NGƯỜI', 'HIỂU CẢ HỆ THỐNG'], low: 'thấu cảm con người', high: 'hiểu cả hệ thống', neg: 'P08', pos: 'P07' }\n    };\n    const P = {\n      P01: { h: 'Bạn thường hành động trước khi mọi thứ hoàn toàn rõ ràng.', strength: ['Bạn có khả năng tạo đà cho đội ngũ, giúp công việc không bị mắc kẹt quá lâu trong sự mơ hồ và thiếu chắc chắn.'], tension: ['Bạn có thể giải quyết vấn đề rất nhanh — nhưng đôi khi chính tốc độ đó lấy đi cơ hội để team tự suy nghĩ.'], team: ['Team có thể cảm thấy bạn là người giúp họ tiến lên.', 'Nhưng nếu pattern này trở thành mặc định, họ cũng có thể quen với việc chờ bạn đưa ra câu trả lời.'], refl: 'Bạn đang giúp team tiến lên — hay đang tiến lên thay team?', shift: ['Lần tới khi team mang một vấn đề đến, thử hỏi:', '\"Em nghĩ chúng ta nên làm gì?\"'] },\n      P02: { h: 'Bạn thường muốn hiểu chuyện gì đang xảy ra trước khi quyết định phải làm gì.', strength: ['Bạn có xu hướng nhìn sâu vào nguyên nhân cốt lõi phía sau vấn đề, thay vì chỉ xử lý dựa trên những dữ liệu bề nổi.'], tension: ['Nhưng có những tình huống không cho bạn nhiều thời gian để hiểu hết.'], team: ['Team có thể cảm thấy bạn rất cẩn trọng và có chiều sâu.', 'Nhưng trong những lúc cần một quyết định nhanh, họ cũng có thể chờ bạn lâu hơn cần thiết.'], refl: 'Khi nào việc hiểu thêm thực sự tạo ra một quyết định tốt hơn — và khi nào nó chỉ đang trì hoãn quyết định?', shift: ['Thử phân biệt:', '\"Tôi cần thêm thông tin\" với \"Tôi đang chưa muốn quyết.\"'] },\n      P03: { h: 'Bạn thường nhìn thấy người đứng sau vấn đề.', strength: ['Khi hiệu suất hay tinh thần của một thành viên thay đổi, bạn có xu hướng tìm hiểu điều gì đang thực sự diễn ra với họ, thay vì đi thẳng vào giải pháp.'], tension: ['Sự quan tâm tạo ra niềm tin.', 'Nhưng nếu thiếu một kỳ vọng đủ rõ, sự hỗ trợ có thể vô tình làm vấn đề kéo dài.'], team: ['Team có thể cảm thấy: \"Leader này thực sự quan tâm đến mình.\"', 'Nhưng họ cũng cần biết: \"Vậy kết quả nào vẫn được kỳ vọng ở tôi?\"'], refl: 'Bạn có đang giúp người khác cảm thấy được hiểu — nhưng chưa đủ rõ về điều họ cần thay đổi?', shift: ['Kết hợp hai câu: \"Tôi muốn hiểu chuyện gì đang xảy ra.\"', 'và: \"Đồng thời, chúng ta cần thống nhất điều gì phải thay đổi.\"'] },\n      P04: { h: 'Khi có vấn đề, bạn thường nhanh chóng quay về điều cần được giải quyết.', strength: ['Bạn có khả năng đưa đội ngũ trở lại trọng tâm một cách nhanh chóng, giúp mọi người không bị cuốn quá lâu vào cảm xúc hay những tranh luận kéo dài.'], tension: ['Nhưng điều cần được giải quyết không phải lúc nào cũng chỉ là vấn đề công việc.', 'Có thể còn có: sự thất vọng, lo lắng, mất niềm tin hoặc kháng cự.'], team: ['Team có thể cảm thấy: \"Leader rất rõ ràng.\"', 'Nhưng đôi khi cũng có thể: \"Mình chưa kịp nói hết thì đã sang phần giải pháp.\"'], refl: 'Bạn đang giải quyết vấn đề — hay mới chỉ giải quyết phần dễ nhìn thấy nhất của nó?', shift: ['Trước khi chuyển sang: \"Vậy làm gì tiếp?\"', 'thử hỏi: \"Mọi người đang nhìn nhận chuyện này như thế nào?\"'] },\n      P05: { h: 'Bạn khá giỏi giữ mình bình tĩnh khi mọi thứ trở nên căng thẳng.', strength: ['Bạn có xu hướng giữ được sự vững vàng trước áp lực, không để cảm xúc tức thời kéo mình vào những phản ứng vội vàng.', 'Đó là một điểm tựa quan trọng cho đội ngũ trong những tình huống khó.'], tension: ['Nhưng bình tĩnh không đồng nghĩa với việc bạn đã đọc hết những gì đang diễn ra về mặt cảm xúc.'], team: ['Team có thể cảm thấy bạn rất vững.', 'Nhưng một số người cũng có thể không chắc rằng: \"Leader có thực sự nhận ra mình đang gặp vấn đề không?\"'], refl: 'Bạn đang điều tiết cảm xúc — hay đang vô tình gạt nó sang một bên?', shift: ['Trước khi xử lý vấn đề:', '\"Người này đang thực sự cảm thấy gì?\"'] },\n      P06: { h: 'Bạn khá nhạy với những thay đổi trong cảm xúc của người khác.', strength: ['Bạn có xu hướng nhận ra sớm những tín hiệu nhỏ trong đội ngũ: một người bỗng im lặng hơn bình thường, một cuộc họp bắt đầu căng lên, hay một thành viên đang dần mất năng lượng.'], tension: ['Nhưng càng nhạy với cảm xúc xung quanh, leader càng cần giữ được khoảng cách đủ để không bị cảm xúc của người khác dẫn dắt.'], team: ['Team có thể cảm thấy bạn rất tinh tế và dễ tiếp cận.', 'Nhưng nếu quá hấp thụ cảm xúc của người khác, bạn có thể khó giữ được sự rõ ràng cần thiết.'], refl: 'Bạn đang đọc cảm xúc của team — hay đang mang cảm xúc của team về phía mình?' },\n      P07: { h: 'Khi có vấn đề, bạn thường nhìn thấy hệ thống phía sau nó.', strength: ['Khi có vấn đề, bạn có xu hướng không dừng lại ở câu hỏi \"ai đang làm sai\", mà đi tìm điều gì trong cách hệ thống đang vận hành đã khiến chuyện đó xảy ra.'], tension: ['Một hệ thống có thể được sửa rất tốt.', 'Nhưng người đang sống bên trong hệ thống đó vẫn có thể chưa được nhìn thấy.'], team: ['Team có thể cảm thấy bạn rất logic và có khả năng xử lý vấn đề ở gốc.', 'Nhưng đôi khi họ cũng cần được hỏi: \"Bạn đang trải nghiệm chuyện này như thế nào?\"'], refl: 'Hệ thống đã được sửa. Nhưng con người bên trong nó thì sao?', shift: ['Sau câu hỏi: \"Vấn đề nằm ở đâu trong hệ thống?\"', 'thêm: \"Ai đang phải sống với vấn đề này mỗi ngày?\"'] },\n      P08: { h: 'Bạn thường bắt đầu từ con người trước khi nhìn đến hệ thống.', strength: ['Bạn có xu hướng nhìn thấy rõ trải nghiệm, động lực và cảm xúc của từng người, thay vì chỉ nhìn họ qua vai trò hay kết quả công việc.'], tension: ['Nhưng một vấn đề lặp lại không phải lúc nào cũng nằm ở một cá nhân.', 'Đôi khi nó nằm trong: quy trình, vai trò, incentive, quyền hạn hoặc cách tổ chức đang vận hành.'], team: ['Team có thể cảm thấy được quan tâm ở cấp độ cá nhân.', 'Nhưng nếu nguyên nhân hệ thống không được xử lý, cùng một vấn đề có thể quay lại.'], refl: 'Bạn đang giúp một người vượt qua vấn đề — hay đang sửa thứ khiến nhiều người gặp cùng một vấn đề?' },\n      P09: { h: 'Bạn không quá phụ thuộc vào một cách lãnh đạo duy nhất.', strength: ['Bạn có khả năng linh hoạt chuyển đổi giữa con người và kết quả, giữa phản tư và hành động, giữa cảm xúc và sự tỉnh táo, tùy theo điều bối cảnh đang cần.'], tension: ['Cân bằng không có nghĩa là luôn đứng giữa.', 'Có những lúc cần: một quyết định rõ ràng.', 'Có những lúc cần: thêm một chút lắng nghe.'], refl: 'Tình huống này đang cần tôi nghiêng về phía nào?' }\n    };\n    // Narrative signal lines per balance side (negative = left pole, positive = right pole).\n    const SIGTEXT = {\n      A: { neg: ['CON NGƯỜI', 'Bạn có xu hướng chú ý đến trải nghiệm của người khác khi có dấu hiệu bất thường.'], pos: ['KẾT QUẢ', 'Bạn thường nhanh chóng đưa vấn đề về phía giải pháp.'] },\n      B: { neg: ['PHẢN TƯ', 'Bạn dành thời gian nhìn lại khi nhận được phản hồi quan trọng.'], pos: ['HÀNH ĐỘNG', 'Bạn có xu hướng chuyển khá nhanh từ vấn đề sang hành động.'] },\n      C: { neg: ['CẢM XÚC', 'Bạn dễ nhận ra khi cảm xúc trong một cuộc trao đổi đang thay đổi.'], pos: ['BÌNH TĨNH', 'Bạn có xu hướng giữ mình ổn định trước khi phản ứng.'] },\n      D: { neg: ['TỪNG NGƯỜI', 'Bạn có xu hướng bắt đầu từ trải nghiệm của từng người.'], pos: ['HỆ THỐNG', 'Khi có vấn đề, bạn có xu hướng tìm nguyên nhân ở cách hệ thống vận hành.'] }\n    };\n    // Demo answer sets so stakeholders can preview dynamic result states (Tweaks → demoState).\n    const DEMO = {\n      A: { 1: 2, 2: 3, 3: 2, 4: 3, 5: 4, 6: 'A', 7: 'B', 8: 'A', 9: 'B', 10: 'B', 11: 'B', 12: 'B', 13: 'B', 14: 'D', 15: 'A' },\n      B: { 1: 3, 2: 5, 3: 4, 4: 5, 5: 4, 6: 'B', 7: 'A', 8: 'B', 9: 'A', 10: 'A', 11: 'B', 12: 'A', 13: 'A', 14: 'C', 15: 'D' },\n      C: { 1: 3, 2: 3, 3: 3, 4: 3, 5: 3, 6: 'A', 7: 'B', 8: 'B', 9: 'A', 10: 'B', 11: 'B', 12: 'A', 13: 'A', 14: 'C', 15: 'C' }\n    };\n    this.__mini = { L5, QS, SIG, P, SIGTEXT, DEMO };\n    return this.__mini;\n  }\n  // Directional signals on four balances. Relative tendencies only — not a score, not validated psychometrics.\n  computeResult(ans) {\n    const lk = n => ((ans[n] || 3) - 3) / 2;\n    const fc = (n, map) => map[ans[n]] || 0;\n    const A = (-lk(4) - lk(5) + fc(8, { A: 1, B: -1 }) + fc(10, { A: -1, B: 1 }) + fc(11, { A: 1, B: -1 }) + fc(15, { A: 1, B: 1, D: -1 })) / 6;\n    const B = (-lk(1) - lk(3) + fc(6, { A: 1, B: -1 }) + fc(7, { A: -1, B: 1 }) + fc(9, { A: -1, B: 1 }) + fc(12, { A: -1, B: 1 })) / 6;\n    const C = -(lk(2) + fc(7, { A: -1 }) + fc(10, { A: 1, B: -1 }) + fc(11, { A: -1, B: 1 }) + fc(15, { A: -1, D: 1 })) / 5; // positive = regulation (right pole)\n    const D = (lk(1) - lk(4) + fc(10, { A: -1, B: 1 }) + fc(13, { A: -1, B: 1 }) + fc(14, { A: 1, D: 1 })) / 5;\n    const lean = { A, B, C, D };\n    const level = v => Math.abs(v) < 0.2 ? 0 : Math.abs(v) < 0.45 ? 1 : 2;\n    const ord = ['A', 'B', 'C', 'D'].sort((x, y) => Math.abs(lean[y]) - Math.abs(lean[x]));\n    const m = this.MINI();\n    let profile = 'P09', h = null, sec = null;\n    const primary = { sig: ord[0], lean: lean[ord[0]], level: level(lean[ord[0]]) };\n    if (primary.level > 0) {\n      profile = lean[primary.sig] < 0 ? m.SIG[primary.sig].neg : m.SIG[primary.sig].pos;\n      if (level(B) === 2 && B > 0 && level(A) === 2 && A > 0) { profile = 'P01'; h = 'Bạn thường nhanh chóng đưa mọi thứ về phía giải pháp.'; }\n      else if (level(lean[ord[1]]) > 0) sec = { sig: ord[1], lean: lean[ord[1]], level: level(lean[ord[1]]) };\n    }\n    const r = v => Math.round(v * 100) / 100;\n    return { profile, h, leans: { A: r(A), B: r(B), C: r(C), D: r(D) }, prim: { sig: primary.sig, lean: r(primary.lean), level: primary.level }, sec: sec && { sig: sec.sig, lean: r(sec.lean), level: sec.level }, date: new Date().toLocaleDateString('vi-VN') };\n  }\n  saveMini() { try { localStorage.setItem('seliMini15State', JSON.stringify({ lead: this.state.lead, result: this.state.result || null })); } catch (e) {} }\n  setLead(k, e) { const lead = { ...this.state.lead, [k]: e.target.value }; this.setState({ lead, formError: '' }); }\n  startQuiz() {\n    const l = this.state.lead;\n    const err = !l.name.trim() ? 'Vui lòng điền họ và tên.' : !/.+@.+\\..+/.test(l.email.trim()) ? 'Email chưa đúng định dạng.' : !l.company.trim() ? 'Vui lòng điền tên công ty.' : !l.role.trim() ? 'Vui lòng điền chức vụ.' : '';\n    if (err) { this.setState({ formError: err }); return; }\n    this.setState({ formError: '', phase: 'quiz', qi: 0, answers: {}, result: null }, () => this.saveMini());\n  }\n  pick(n, o) {\n    if (this.state.phase !== 'quiz') return;\n    this.setState({ answers: { ...this.state.answers, [n]: o } });\n    if (this.props.autoAdvance ?? false) { clearTimeout(this.__adv); this.__adv = setTimeout(() => this.advance(), 360); }\n  }\n  advance() {\n    const st = this.state;\n    if (st.phase !== 'quiz' || st.answers[st.qi + 1] === undefined) return;\n    if (st.qi < 14) this.setState({ qi: st.qi + 1 });\n    else {\n      this.setState({ phase: 'processing' });\n      clearTimeout(this.__proc);\n      this.__proc = setTimeout(() => {\n        const result = this.computeResult(this.state.answers);\n        this.setState({ phase: 'result', result, snapReady: false }, () => { this.saveMini(); this.armSnap(); });\n      }, 1800);\n    }\n  }\n  restartQuiz() { this.setState({ phase: 'quiz', qi: 0, answers: {}, result: null, snapReady: false }, () => this.saveMini()); }\n  armSnap() { clearTimeout(this.__snap); this.__snap = setTimeout(() => this.setState({ snapReady: true }), 250); }\n  shareFb() { const u = encodeURIComponent(this.props.shareUrl ?? 'https://seli.vn/mini-seli'); window.open('https://www.facebook.com/sharer/sharer.php?u=' + u, '_blank', 'noopener'); }\n  shareLi() { const u = encodeURIComponent(this.props.shareUrl ?? 'https://seli.vn/mini-seli'); window.open('https://www.linkedin.com/sharing/share-offsite/?url=' + u, '_blank', 'noopener'); }\n  wrapText(g, text, x, y, maxW, lh) {\n    const words = text.split(' '); let line = '', yy = y;\n    words.forEach(w => { const t = line ? line + ' ' + w : w; if (g.measureText(t).width > maxW && line) { g.fillText(line, x, yy); line = w; yy += lh; } else { line = t; } });\n    if (line) g.fillText(line, x, yy); return yy + lh;\n  }\n  countLines(g, text, font, maxW) {\n    g.font = font;\n    const words = text.split(' '); let line = '', n = 0;\n    words.forEach(w => { const t = line ? line + ' ' + w : w; if (g.measureText(t).width > maxW && line) { n++; line = w; } else { line = t; } });\n    if (line) n++;\n    return n;\n  }\n  resultTexts(r) {\n    const p = this.MINI().P[r.profile];\n    return { h: r.h || p.h, strengthShort: p.strength[0], tensionShort: p.tension[0], refl: p.refl };\n  }\n  downloadCard() {\n    const r = this.state.result, l = this.state.lead, m = this.MINI();\n    if (!r) return;\n    const p = m.P[r.profile], t = this.resultTexts(r), sp = this.spectrumVals(r.prim);\n    const leans = r.leans || { A: 0, B: 0, C: 0, D: 0 };\n    document.fonts.ready.then(() => {\n      const c = document.createElement('canvas'); c.width = 1080; c.height = 100;\n      let g = c.getContext('2d');\n      const W = 1080, X = 96, MW = W - X * 2;\n      const fH = '600 62px Genos, Archivo, sans-serif', fB = '500 27px Archivo, sans-serif', fL = '700 20px Archivo, sans-serif', fQ = '600 44px Genos, Archivo, sans-serif';\n      const lhH = 68, lhB = 39, lhQ = 50;\n      const blocks = [\n        ['LỰC KÉO MẠNH NHẤT', [sp.interp], fB, lhB, '#E8ECF6'],\n        ['ĐIỀU NÀY ĐANG GIÚP TÔI', p.strength, fB, lhB, '#E8ECF6'],\n        ['MỘT ĐIỀU ĐÁNG ĐỂ Ý', p.tension, fB, lhB, '#E8ECF6'],\n        p.team ? ['NHÌN TỪ PHÍA ĐỘI NGŨ', p.team, fB, lhB, '#E8ECF6'] : null,\n        ['MỘT CÂU HỎI TÔI SẼ THỬ', [p.refl], fQ, lhQ, '#F0603D'],\n        p.shift ? ['THỬ MỘT ĐIỀU', p.shift, fB, lhB, '#E8ECF6'] : null\n      ].filter(Boolean);\n      const hL = this.countLines(g, t.h, fH, MW);\n      const bL = blocks.map(b => b[1].reduce((s, tx) => s + this.countLines(g, tx, b[2], MW), 0));\n      let y = 236 + hL * lhH + 40;\n      const ySnap = y; y += 40 + 4 * 78;\n      const yBlocks = y + 30;\n      y = yBlocks; blocks.forEach((b, i) => { y += 30 + 16 + bL[i] * b[3] + (b[1].length - 1) * 8 + 34; });\n      const yFoot = y + 16, H = yFoot + 90;\n      c.height = H; g = c.getContext('2d');\n      const bg = g.createLinearGradient(0, 0, 0, H); bg.addColorStop(0, '#18294f'); bg.addColorStop(0.35, '#0e1a38'); bg.addColorStop(1, '#081026');\n      g.fillStyle = bg; g.fillRect(0, 0, W, H);\n      const glow = g.createRadialGradient(920, 60, 0, 920, 60, 560); glow.addColorStop(0, 'rgba(240,96,61,0.26)'); glow.addColorStop(1, 'rgba(240,96,61,0)');\n      g.fillStyle = glow; g.fil
